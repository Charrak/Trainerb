# Continuous integration for this repository.
#
# The project is a Node.js/TypeScript monorepo (Next.js + NestJS, PostgreSQL and
# Redis). The previous `deno.yml` was GitHub's stock Deno starter workflow: it
# ran `deno lint` / `deno test` over Node sources, CommonJS tests and the
# generated Prisma client, and could therefore never pass. It was replaced by
# the checks the project actually enforces.

name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch makes the older run irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # The services mirror compose.yaml, but only the parts CI needs: integration
    # tests use an isolated `trainerb_test` database and Redis database 15. The
    # init script creates the test database on first start, exactly like the
    # development workflow does.
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: trainerb
          POSTGRES_PASSWORD: trainerb-local-only
          POSTGRES_DB: trainerb_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trainerb -d trainerb_dev"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.6-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same major as .nvmrc and the `engines` field.
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create the isolated test database
        env:
          PGPASSWORD: trainerb-local-only
        run: |
          # The service image only creates trainerb_dev; the suite refuses to run
          # against anything that does not end in `_test`.
          psql -h 127.0.0.1 -U trainerb -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE trainerb_test OWNER trainerb;' \
            -c 'CREATE DATABASE cert_drill_test OWNER trainerb;'

      - name: Prepare a local environment
        run: |
          cp .env.example .env
          # Five independent 32-byte keys, exactly as documented in .env.example.
          for name in SESSION_HMAC_KEY CSRF_HMAC_KEY TOKEN_HMAC_KEY DATA_ENCRYPTION_KEY AUDIT_PSEUDONYMIZATION_KEY; do
            value="$(openssl rand -base64 32)"
            sed -i "s|^${name}=.*|${name}=${value}|" .env
          done
          grep -q '^SESSION_HMAC_KEY=.\{43\}=$' .env

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Test the scan protocol against an isolated ClamAV daemon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clamav-daemon
          # Run as the unprivileged runner with only the temporary test DB/socket,
          # independently of the distribution service and its system paths.
          install -m 755 /usr/sbin/clamd "$RUNNER_TEMP/clamd-test"
          TEST_CLAMD_BINARY="$RUNNER_TEMP/clamd-test" node --test tests/scanner/clamd.test.cjs

      - name: Install pinned S3 test gateway
        working-directory: ${{ runner.temp }}
        run: |
          archive=versitygw_v1.11.0_Linux_x86_64
          curl -fsSL --retry 3 "https://github.com/versity/versitygw/releases/download/v1.11.0/$archive.tar.gz" -o gateway.tar.gz
          echo '1f075c9dc92fef232f5b3c7465711ddc5e1b062b2b6df4a3bd246a4be5b35b52  gateway.tar.gz' | sha256sum --check
          tar xzf gateway.tar.gz "$archive/versitygw"
          echo "$PWD/$archive" >> "$GITHUB_PATH"

      - name: Integration tests (including upload through learner download)
        env:
          TEST_CLAMD_BINARY: ${{ runner.temp }}/clamd-test
        run: bash scripts/test-integration-s3.sh

      - name: Restore synthetic certificates to a fresh database
        env:
          E2E_ALLOW_TEST_DATA: 'yes'
          TEST_DATABASE_URL: postgresql://trainerb:trainerb-local-only@127.0.0.1:5432/cert_drill_test
          TEST_REDIS_URL: redis://127.0.0.1:6379/14
        run: |
          # Use the exact service image for the clients; no runner-specific apt version.
          # Both commands receive the private archive path as their last argument.
          mkdir -p "$RUNNER_TEMP/pg-clients"
          cat > "$RUNNER_TEMP/pg-clients/pg_dump" <<'SH'
          #!/bin/bash
          set -eu
          archive="${!#}"
          exec docker run --rm --network host --user "$(id -u):$(id -g)" \
            -v "$(dirname "$archive"):$(dirname "$archive")" \
            -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGPASSWORD -e PGCONNECT_TIMEOUT \
            postgres:16.15 "${0##*/}" "$@"
          SH
          chmod 755 "$RUNNER_TEMP/pg-clients/pg_dump"
          ln -s pg_dump "$RUNNER_TEMP/pg-clients/pg_restore"
          PATH="$RUNNER_TEMP/pg-clients:$PATH" npm run test:certificates:restore

      - name: Build
        run: npm run build

      # End-to-end tests need a browser. Playwright's Chromium is not part of the
      # dependency set, so this stays a manual step until it is added on purpose.
      - name: Note about end-to-end tests
        run: echo '::notice::E2E smoke tests need Playwright/Chromium and are not part of CI yet.'
