// Load the CheckCommand on the executing agent. The Service belongs on the
// scheduling master. No check is assigned unless the host opts in explicitly.
object CheckCommand "trainerb-operations" {
  command = [ "$trainerb_node$", "$trainerb_probe$" ]
  env = {
    MONITOR_READONLY_DATABASE_URL = "$trainerb_monitor_url$"
  }
  vars.trainerb_node = "/usr/bin/node"
  vars.trainerb_probe = "/opt/trainerb/scripts/operations-probe.mjs"
  timeout = 20s
}

apply Service "trainerb-operations" {
  check_command = "trainerb-operations"
  command_endpoint = host.name
  check_interval = 1m
  retry_interval = 30s
  max_check_attempts = 3
  assign where host.vars.trainerb_operations == true && host.vars.trainerb_monitor_url
}
